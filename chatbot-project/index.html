<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chatbot Hamzawy</title>

<style>
:root{
  --bg:#0b1220; --text:#e9eefc; --muted:#9fb1e5;
  --accent:#5b8cff; --border:rgba(255,255,255,.08);
  --me: rgba(91,140,255,.22); --bot: rgba(27,44,85,.75);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: radial-gradient(1200px 700px at 20% 0%, #13254d 0%, var(--bg) 55%);
  color:var(--text);
  height:100vh; display:flex; align-items:center; justify-content:center;
  padding:16px;
}
.chat{
  width:min(900px,100%); height:min(650px,100%);
  background: rgba(15,26,51,.75);
  border:1px solid var(--border);
  border-radius:18px;
  display:flex; flex-direction:column;
  backdrop-filter: blur(10px);
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
}
header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
}
header b{font-size:15px}
header span{font-size:12px;color:var(--muted)}
.messages{
  flex:1; padding:16px; overflow:auto;
  display:flex; flex-direction:column; gap:10px;
}
.msg{
  max-width:75%;
  padding:10px 14px;
  border-radius:16px;
  border:1px solid var(--border);
  font-size:14px;
  line-height:1.4;
  white-space:pre-wrap;
  word-wrap:break-word;
}
.me{align-self:flex-end; background:var(--me); border-color: rgba(91,140,255,.35)}
.bot{align-self:flex-start; background:var(--bot)}
.err{align-self:flex-start; background: rgba(255,80,80,.12); border-color: rgba(255,80,80,.35)}
footer{
  border-top:1px solid var(--border);
  padding:12px; display:flex; gap:10px;
  background: rgba(17,31,63,.25);
}
textarea{
  flex:1; resize:none;
  border-radius:14px;
  border:1px solid var(--border);
  background: rgba(0,0,0,.2);
  color:var(--text);
  padding:10px 12px;
  font:inherit;
  min-height:44px; max-height:140px;
  outline:none;
  line-height:1.35;
}
button{
  background:linear-gradient(135deg,var(--accent),#7c5cff);
  border:none; border-radius:14px;
  padding:0 18px;
  font-weight:800; color:white;
  cursor:pointer;
}
button:disabled{opacity:.6; cursor:not-allowed}
.clear{
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  padding:6px 12px;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
}
.clear:hover{background: rgba(255,255,255,.05)}

/* Typing */
.typing{
  align-self:flex-start;
  background: var(--bot);
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px 14px;
  display:flex; gap:6px;
  width: fit-content;
}
.typing span{
  width:7px; height:7px;
  background: rgba(233,238,252,.85);
  border-radius:50%;
  animation: blink 1.4s infinite both;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{
  0%{opacity:.2}
  20%{opacity:1}
  100%{opacity:.2}
}
</style>
</head>

<body>
<div class="chat">
  <header>
    <div>
      <b>Hamzawy Chatbot  </b><br>
      <span>Simple Chatbot</span>
    </div>
    <button class="clear" id="clear">Clear</button>
  </header>

  <div class="messages" id="messages"></div>

  <footer>
    <textarea id="input" placeholder="Type your message... (Enter to send, Shift+Enter newline)"></textarea>
    <button id="send">Send</button>
  </footer>
</div>

<script>
  // ===== CONFIG (local demo only) =====
const API_URL = "/api/chat";

  const MODEL = "gpt-4o-mini";

  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let chat = JSON.parse(localStorage.getItem("chat") || "[]");
  let typingEl = null;

  function addBubble(role, content, extraClass=""){
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "me" : "bot") + (extraClass ? " " + extraClass : "");
    div.textContent = content;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function render(){
    messages.innerHTML = "";
    chat.forEach(m => addBubble(m.role, m.content));
    messages.scrollTop = messages.scrollHeight;
  }
  render();

  function showTyping(){
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.innerHTML = "<span></span><span></span><span></span>";
    messages.appendChild(typingEl);
    messages.scrollTop = messages.scrollHeight;
  }

  function hideTyping(){
    if(typingEl){
      typingEl.remove();
      typingEl = null;
    }
  }

  document.getElementById("clear").onclick = ()=>{
    chat = [];
    localStorage.removeItem("chat");
    render();
  };

  // Robust text extraction for Responses API
  function extractText(data){
    // Prefer output_text blocks
    const blocks = data?.output?.[0]?.content || [];
    const txt = blocks
      .filter(b => b.type === "output_text" && typeof b.text === "string")
      .map(b => b.text)
      .join("\n")
      .trim();
    if (txt) return txt;

    // Fallback: some responses may expose "output_text"
    if (typeof data?.output_text === "string" && data.output_text.trim()) return data.output_text.trim();

    return "";
  }

  async function sendMessageToAPI(userText){
    const payload = {
      model: MODEL,
      input: [
        { role: "system", content: "You are a helpful assistant." },
        ...chat.map(m => ({ role: m.role, content: m.content })),
        { role: "user", content: userText }
      ]
    };

 const res = await fetch(API_URL, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify(payload)
});


    const rawText = await res.text(); // اقرأ الرد كنص الأول عشان نعرض الأخطاء بسهولة
    let data = null;
    try { data = JSON.parse(rawText); } catch { /* ignore */ }

    if(!res.ok){
      const msg = data?.error?.message || rawText || ("HTTP " + res.status);
      throw new Error(`API Error (${res.status}): ${msg}`);
    }

    const out = extractText(data);
    if(!out) throw new Error("API returned no text. (Check response shape in console)");
    return out;
  }

  async function handleSend(){
    const text = input.value.trim();
    if(!text) return;

    if(!API_KEY || API_KEY.includes("PUT_YOUR_KEY_HERE")){
      addBubble("assistant", "❌ Add your API key in API_KEY first.", "err");
      return;
    }

    input.value = "";
    chat.push({ role:"user", content:text });
    localStorage.setItem("chat", JSON.stringify(chat));
    render();

    sendBtn.disabled = true;
    input.disabled = true;
    showTyping();

    try{
      const reply = await sendMessageToAPI(text);
      hideTyping();
      chat.push({ role:"assistant", content:reply });
      localStorage.setItem("chat", JSON.stringify(chat));
      render();
    }catch(err){
      console.error(err);
      hideTyping();
      addBubble("assistant", "❌ " + err.message, "err");
    }finally{
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", handleSend);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      handleSend();
    }
  });
</script>
</body>
</html>
